name: Build TV APK

# Dispatch only: nothing runs on push. Every secret comes from the repo's
# Actions secrets (TG_API_ID, TG_API_HASH, TG_BOT_TOKEN, TG_CHAT_ID, TG_ADMIN_ID,
# TV_KS_B64, TV_KS_PASS). The APK embeds the bot token, so it is NOT uploaded as an
# artifact or release: the build only checks that it compiles.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (optional; default 12)"
        required: false
        default: ""
      version_name:
        description: "versionName (optional; default 2.2)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IN_VCODE: ${{ github.event.inputs.version_code }}
      IN_VNAME: ${{ github.event.inputs.version_name }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
      KS_B64: ${{ secrets.TV_KS_B64 }}
      KS_PASS: ${{ secrets.TV_KS_PASS }}
    steps:
      - name: Check required secrets
        run: |
          for v in TG_API_ID TG_API_HASH TG_BOT_TOKEN TG_CHAT_ID TG_ADMIN_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is missing (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Prepare release keystore (optional)
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KS_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::notice::Keystore secrets not set, the APK is signed with the debug key"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK (compile check, not published)
        working-directory: tv-app
        run: |
          ARGS=(
            -PtgApiId="$TG_API_ID"
            -PtgApiHash="$TG_API_HASH"
            -PtgBotToken="$TG_BOT_TOKEN"
            -PtgGroupId="$TG_CHAT_ID"
            -PtgAdminId="$TG_ADMIN_ID"
            -PversionCode="${IN_VCODE:-12}"
            -PversionName="${IN_VNAME:-2.2}"
          )
          if [ -n "$KS_FILE" ]; then
            ARGS+=(-PksFile="$KS_FILE" -PksPass="$KS_PASS" -PksAlias=tgtv)
          fi
          gradle --no-daemon assembleRelease "${ARGS[@]}"
